# Hand-computed outcomes for the toy scenario (PRD §6.9). Times are offsets from T0 (s).
#
# Setup: 3 DCs x 4 GPUs. dc0 = region 1 (Delhi NCR, NR), dc1 = 2 (Mumbai, WR), dc2 = 3 (Chennai,
# SR). Intensities are hand-set toy values, not Indian data.
# Forecast v0 (capture 0):     r1 = 100, r2 = 300, r3 = 200 for all 12 slots.
# Forecast v1 (capture 3600):  r1 rises to 400 from slot 2 (t = 3600) on.
# Truth:                       r1 = 100,100 then 400; r2 = 300; r3 = 200.
# Power: 1 kW per GPU, 0.01 kW per core.  P(J3) = 4 + 4*0.01 = 4.04 kW, others = gpu_req kW.
# Runtimes equal every quantile, so all wait estimates are exact and w_lo = w_mid = w_hi.
#
# Jobs (gpu, runtime, deadline): J1 (2, 3600, 21600), J2 (2, 3600, 21600), J3 (4, 1800, 21600),
# J4 (1, 1800, 21600) and J5 (1, 3600, 2000) arrive at 900, J6 (3, 1800, 21600) at 1800.
# Same-time arrivals are ordered by (arrival, deadline, job_id), so J5 arrives before J4.
#
# --- fcfs: release at slot0 = ceil_to_slot(t) at the DC with the earliest projected start ---
# Ties go to DCs in rotated order starting at (arrival index) mod 3 (PRD §11, v0.8). Arrival
# order: J1 0, J2 1, J3 2, J5 3, J4 4, J6 5.
# t=0    J1 (n=0): all DCs start at 0; rotation starts at dc0 -> dc0.
#        J2 (n=1): all DCs start at 0; rotation starts at dc1 -> dc1.
#        J3 (n=2, 4 GPUs): dc0 and dc1 busy until 3600; dc2 free at 0 -> dc2.
#        All released and started at 0.  J1, J2 end 3600; J3 ends 1800.
# t=900  J5 (n=3): slot0 = 1800; every DC can start it at 1800; rotation starts at dc0 -> dc0.
#        J4 (n=4): slot0 = 1800; every DC can start it at 1800; rotation starts at dc1 -> dc1.
# t=1800 J3 completes first (priority 2).  J6 (n=5, 3 GPUs): dc0 has J1+J5 = 3 GPUs and dc1 has
#        J2+J4 = 3 GPUs until 3600, so 3600 at both; dc2 is free at 1800 -> dc2.
#        Releases: J5 starts on dc0, J4 on dc1, J6 on dc2, all at 1800.
# kgCO2 = P * hours * truth / 1000:
#   J1 2*1*100 = 0.2   J2 2*1*300 = 0.6   J3 4.04*0.5*200 = 0.404   J4 1*0.5*300 = 0.15
#   J5 on dc0, 1800..5400 (ends after deadline 2000: missed): 1*0.5*100 + 1*0.5*400 = 0.25
#   J6 3*0.5*200 = 0.3   total 1.904
#
# --- place_once: best forecast score among feasible candidates (forecast v0 at arrival) ---
# t=0    J1, J2 -> dc0 (100 g/kWh) release 0.  J3 -> dc0 too: it cannot start before 3600
#        there, but 4.04*0.5*100 = 0.202 kg beats dc2 (0.404) and dc1 (0.606).  Equal-score
#        releases 0/1800/3600 all start at 3600; earliest release wins -> 0.  J3 queues behind
#        J1, J2.
# t=900  J5: latest_release < slot0 and 1800 + 3600 > 2000 -> every candidate is
#        DEADLINE_RISK.  Fallback (earliest s + w_hi + r_q90): dc1 and dc2 both finish at
#        5400; tie -> dc1, deadline_risk = 1.
#        J4: dc0 start 5400 (J1, J2 to 3600, then J3 to 5400), score 0.05 < dc2 0.1 -> dc0,
#        release 1800 (equal score, same start, earliest release).
# t=1800 J6: dc0 profile has J3 [3600,5400) at 4 GPUs and J4 [5400,7200) at 1 GPU, so J6
#        (3 GPUs) starts at 5400 with score 0.15 < dc2 0.3 -> dc0, release 1800.
#        Releases: J5 starts at 1800 on dc1; J4 and J6 join the dc0 queue [J3, J4, J6].
# t=3600 v1 arrives (place_once ignores it).  J1 completes: 2 GPUs free -> first-fit skips
#        J3 (4) and starts J4 (1).  J2 completes: 3 free -> J3 still blocked, J6 (3) starts.
# t=5400 J5, J4, J6 complete; J3 finally starts at 5400 and ends at 7200.
# kgCO2 against truth (dc0 is 400 from t = 3600):
#   J1 0.2   J2 0.2   J3 4.04*0.5*400 = 0.808   J4 1*0.5*400 = 0.2   J5 0.3
#   J6 3*0.5*400 = 0.6   total 2.308
# place_once emits more than fcfs (1.904) here because the forecast at arrival was wrong about
# Delhi NCR: this is the gap that re-planning on forecast updates is meant to close.
# --- fixed_savings: as place_once until v1 at t=3600, then re-plans. Same for pred_error, whose
# trigger fires because the incumbent windows' mean forecast went 100 -> 400 ---
# t=1800 update: forecast unchanged, every alternative costs more; all KEEP (J5 is on a fallback).
# t=3600 v1, before the completions (priority 1). Profile: J1, J2 still fill dc0 until 3660 (an
#        estimate reached exactly at t gets one more minute, PRD §9.3). Tie order J3, J4, J6.
#        J3 at its own queue place: 4.04*0.5*400 = 0.808; dc2 at 3600 = 0.404, dc1 = 0.606 -> dc2.
#        J4: dc0 0.2; dc2 only from 5400 behind J3: 1*0.5*200 = 0.1 -> dc2, release 3600.
#        J6: dc0 0.6; dc2 from 5400 beside J4: 3*0.5*200 = 0.3 -> dc2, release 3600.
# Truth for dc2 is 200 throughout: J3 0.404, J4 0.1, J6 0.3; J1 0.2, J2 0.2, J5 0.3; total 1.504.
#
# --- periodic (T = 1800): ticks follow completions and releases at the same instant (§8.4) ---
# t=1800 tick: no gain anywhere; all KEEP.
# t=3600 J1, J2 complete; J4 and J6 start on dc0 at 400 before the tick, so only J3 is pending
#        and it moves to dc2.  J3 0.404, J4 0.2, J6 0.6, J1 0.2, J2 0.2, J5 0.3; total 1.904.
#
# --- pig: truth and actual runtimes at arrival, then no re-planning ---
# t=0    J1, J2 -> dc0 (truth 100 until 3600).  J3: dc0 only from 3600 at 400 = 0.808; dc2 at 0
#        = 0.404, dc1 = 0.606 -> dc2.
# t=900  J5 fallback, as place_once. J4: dc0 from 3600 = 0.2; dc2 free at 1800 = 0.1 -> dc2.
# t=1800 J6: dc0 from 3600 = 0.6; dc2 from 1800 beside J4 = 0.3 -> dc2.  Total 1.504: here it ties
#        with re-planning, which is why it is a reference and not a bound.

policies:
  fcfs:
    total_kg_co2: 1.904
    # kWh: J1 2, J2 2, J3 2.02, J4 0.5, J5 1, J6 1.5 = 9.02. J5 ends 5400 against 2000 (3400 s late).
    metrics:
      kg_co2: 1.904
      energy_kwh: 9.02
      intensity_g_per_kwh: 211.08647450110865   # 1904 / 9.02
      kg_co2_estimable: 1.904                   # runtimes equal their estimates: J_e is every job
      miss_rate: 0.16666666666666666            # J5 of 6 jobs
      tardiness_mean_h: 0.1574074074074074      # 3400 / 6 / 3600
      moves: 0
      stage2_calls: 0
    jobs:
      J1: {dc_id: 0, release: 0,    start: 0,    end: 3600, kg_co2: 0.2,   deadline_missed: 0}
      J2: {dc_id: 1, release: 0,    start: 0,    end: 3600, kg_co2: 0.6,   deadline_missed: 0}
      J3: {dc_id: 2, release: 0,    start: 0,    end: 1800, kg_co2: 0.404, deadline_missed: 0}
      J4: {dc_id: 1, release: 1800, start: 1800, end: 3600, kg_co2: 0.15,  deadline_missed: 0}
      J5: {dc_id: 0, release: 1800, start: 1800, end: 5400, kg_co2: 0.25,  deadline_missed: 1}
      J6: {dc_id: 2, release: 1800, start: 1800, end: 3600, kg_co2: 0.3,   deadline_missed: 0}
  place_once:
    total_kg_co2: 2.308
    metrics:
      kg_co2: 2.308
      energy_kwh: 9.02
      intensity_g_per_kwh: 255.8758314855876    # 2308 / 9.02
      miss_rate: 0.16666666666666666
      moves: 0
    jobs:
      J1: {dc_id: 0, release: 0,    start: 0,    end: 3600, kg_co2: 0.2,   deadline_missed: 0}
      J2: {dc_id: 0, release: 0,    start: 0,    end: 3600, kg_co2: 0.2,   deadline_missed: 0}
      J3: {dc_id: 0, release: 0,    start: 5400, end: 7200, kg_co2: 0.808, deadline_missed: 0}
      J4: {dc_id: 0, release: 1800, start: 3600, end: 5400, kg_co2: 0.2,   deadline_missed: 0}
      J5: {dc_id: 1, release: 1800, start: 1800, end: 5400, kg_co2: 0.3,   deadline_missed: 1,
           deadline_risk: 1}
      J6: {dc_id: 0, release: 1800, start: 3600, end: 5400, kg_co2: 0.6,   deadline_missed: 0}
  fixed_savings: &replanned
    total_kg_co2: 1.504
    stage2_calls: 3
    jobs:
      J1: {dc_id: 0, release: 0,    start: 0,    end: 3600, kg_co2: 0.2,   deadline_missed: 0}
      J2: {dc_id: 0, release: 0,    start: 0,    end: 3600, kg_co2: 0.2,   deadline_missed: 0}
      J3: {dc_id: 2, release: 3600, start: 3600, end: 5400, kg_co2: 0.404, deadline_missed: 0}
      J4: {dc_id: 2, release: 3600, start: 5400, end: 7200, kg_co2: 0.1,   deadline_missed: 0}
      J5: {dc_id: 1, release: 1800, start: 1800, end: 5400, kg_co2: 0.3,   deadline_missed: 1,
           deadline_risk: 1}
      J6: {dc_id: 2, release: 3600, start: 5400, end: 7200, kg_co2: 0.3,   deadline_missed: 0}
  pred_error: *replanned
  # Residuals are 0 on this toy, so w_ab = 0 and θ changes nothing. All three pending jobs pass the
  # screen at t=3600: J3 0.808 - LB 0.404, J4 0.2 - 0.1, J6 0.6 - 0.3, each above the 5 % gate.
  decision_flip: *replanned
  periodic:
    total_kg_co2: 1.904
    jobs:
      J1: {dc_id: 0, release: 0,    start: 0,    end: 3600, kg_co2: 0.2,   deadline_missed: 0}
      J2: {dc_id: 0, release: 0,    start: 0,    end: 3600, kg_co2: 0.2,   deadline_missed: 0}
      J3: {dc_id: 2, release: 3600, start: 3600, end: 5400, kg_co2: 0.404, deadline_missed: 0}
      J4: {dc_id: 0, release: 1800, start: 3600, end: 5400, kg_co2: 0.2,   deadline_missed: 0}
      J5: {dc_id: 1, release: 1800, start: 1800, end: 5400, kg_co2: 0.3,   deadline_missed: 1,
           deadline_risk: 1}
      J6: {dc_id: 0, release: 1800, start: 3600, end: 5400, kg_co2: 0.6,   deadline_missed: 0}
  pig:
    total_kg_co2: 1.504
    jobs:
      J1: {dc_id: 0, release: 0,    start: 0,    end: 3600, kg_co2: 0.2,   deadline_missed: 0}
      J2: {dc_id: 0, release: 0,    start: 0,    end: 3600, kg_co2: 0.2,   deadline_missed: 0}
      J3: {dc_id: 2, release: 0,    start: 0,    end: 1800, kg_co2: 0.404, deadline_missed: 0}
      J4: {dc_id: 2, release: 1800, start: 1800, end: 3600, kg_co2: 0.1,   deadline_missed: 0}
      J5: {dc_id: 1, release: 1800, start: 1800, end: 5400, kg_co2: 0.3,   deadline_missed: 1,
           deadline_risk: 1}
      J6: {dc_id: 2, release: 1800, start: 1800, end: 3600, kg_co2: 0.3,   deadline_missed: 0}
