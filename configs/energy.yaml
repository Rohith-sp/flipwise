# Energy and emission parameters (PRD §7.2, §6.2.2). Every value needs a citation before any
# real-data emission figure is reported (blockers B3, B4). Empty values make the commands that
# need them fail on purpose.

emission_factors:
  # Operational CO2 per fuel, gCO2/kWh net generation: generation-weighted average over the
  # CEA CO2 Baseline Database stations of each fuel. Hydro, nuclear, solar and wind are 0.
  # CEA CO2 Baseline Database User Guide v19.0 (Dec 2023), Table 6 "Weighted average specific
  # emissions for fossil fuel-fired stations in FY 2022-23": coal 0.978, lignite 1.286,
  # gas 0.478 t CO2/MWh; diesel not published. v20.0 (FY 2023-24) would match the carbon period
  # better but no public copy was found (29 Oct 2026). Grid-India reports "Gas, Naptha & Diesel"
  # as one figure, so it takes the gas-only factor: a slight underestimate for that small share.
  cea_database_version: "v19.0 (FY 2022-23), User Guide Table 6"
  g_per_kwh:
    coal: 978.0
    lignite: 1286.0
    gas: 478.0
    biomass: 0.0                  # [Open] PRD §6.2.2: 0 by default
    other: 0.0                    # [Open] PRD §6.2.2: 0 by default

power:
  # PRD §7.2, D58. kgCO2 is reported as a bracket: `nameplate` (requested GPUs at datasheet power,
  # an upper bound) and `measured` (datasheet power x each job's measured GPU use from Alibaba's
  # pai_sensor_table, a lower bound because idle draw is left out). The scheduler always scores
  # with nameplate power. `power_mode` in configs/base.yaml picks the evaluator's end.
  mode: measured
  # kW per GPU, NVIDIA datasheet board power: Tesla V100 SXM2 300 W (V100M32 assumed the same),
  # Tesla P100 250 W, Tesla T4 70 W. MISC (K40m, K80, M60; the trace does not say which): 150 W,
  # from NVIDIA's K80 board spec (150 W cap per GPU, 300 W per two-GPU board) and the M60 (300 W
  # two-GPU board); the K40m (about 235 W) is not separated, so MISC may be low.
  gpu_kw_by_type: {V100: 0.30, V100M32: 0.30, P100: 0.25, T4: 0.07, MISC: 0.15}
  # The scheduler scores every job with p_gpu_kw and p_cpu_kw (the v0.8 scale), never with the
  # table above: absolute thresholds (tie tolerance, frozen g_abs and kappa) were set at this
  # scale, so keeping it leaves every decision as in the frozen runs (F24). Also used for any GPU
  # type missing from the table.
  p_gpu_kw: 0.30
  # [Assumption] kW per core. The trace names no CPU model; 10 W is in the range of server CPU
  # TDP / cores (Green Algorithms method, Lannelongue et al. 2021). Swept by the 0.5/1.5 multipliers.
  p_cpu_kw: 0.01
  pue: 1.0
