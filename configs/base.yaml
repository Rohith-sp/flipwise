# Base experiment configuration (PRD §6, §14.2, §14.3).
# Changing a window or a carbon Monday is a research decision: record the reason here.

data:
  jobs: data/processed/jobs_v2020.csv
  forecast: data/processed/carbon_forecast.csv
  truth: data/processed/carbon_truth.csv
  coverage: data/processed/capture_coverage.csv
  manifests: data/manifests

regions: [1, 13, 7]          # dc0 North Scotland (~35 g/kWh), dc1 London (~158), dc2 South Wales (~278)
horizon_days: 15             # 7-day arrival slice + 8 days to finish (PRD §8.6)

splits:
  runtime_fit_trace_days: [0, 21]
  residual_fit_carbon: ["2023-03-13", "2023-06-30"]
  validation:
    trace_days: [21, 42]
    carbon_period: ["2023-07-01", "2023-08-31"]
    # Each 15-day horizon must end inside the period.
    carbon_mondays: ["2023-07-03", "2023-07-17", "2023-07-31", "2023-08-14"]
  test:
    trace_days: [42, 70]
    carbon_period: ["2023-09-01", "2024-01-31"]
    # Avoid archive gaps (data/manifests/carbon_archive.json): 2023-10-20/22 and
    # 2023-12-31/2024-01-01 have > 2 consecutive slots without truth. Mondays whose
    # 15-day horizon overlaps those gaps are excluded; the four below are spread over the period.
    carbon_mondays: ["2023-09-04", "2023-10-30", "2023-11-27", "2024-01-08"]

dev:
  # EL Phase 2 dev replicate: first validation slice and Monday, 10 % job sampling.
  trace_days: [21, 28]
  carbon_monday: "2023-07-03"
  sampling: 0.1
