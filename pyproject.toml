[project]
name = "flipwise"
version = "0.1.0"
description = "Offline simulator for decision-flip-triggered re-evaluation of pending jobs in carbon-aware scheduling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pandas>=3.0,<4", "numpy>=2.4,<3", "pyyaml>=6.0", "matplotlib>=3.10"]

[project.optional-dependencies]
dashboard = ["plotly>=6"]

[project.scripts]
flipwise = "flipwise.cli:main"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flipwise"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
